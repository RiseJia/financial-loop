# 调研状态机：把调研从"文档"变成"可检查的状态"
#
# 每个节点四件套：evidence（带时间戳的证据）、triggers（证伪触发器+状态）、
# open_questions（未决问题）、last_verified。
# `finloop loop-status` 据此自动判定：哪些过期、哪些待核、本轮是否可退出。
#
# trigger.status: ok（论点健康）| warning（黄色信号）| fired（已证伪，重审）
# question.status: open（阻塞退出）| deferred（显式搁置，不阻塞，需注明理由）

