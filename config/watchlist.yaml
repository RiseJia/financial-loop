# 自选股配置
# tickers: 个股自选列表，daily report 与 batch 分析都会用到
# benchmarks/sectors/macro: 日报中的市场概览部分

# 主线：AI 上下游产业（完整 universe 见 universe_ai.yaml，此处为日报扫描的核心关注）
tickers:
  - NVDA   # 上游：GPU
  - AVGO   # 上游：定制ASIC/网络
  - TSM    # 上游：代工
  - ASML   # 上游：光刻
  - MU     # 上游：HBM
  - VRT    # 上游：电源散热
  - ANET   # 上游：交换机
  - CEG    # 上游：电力
  - MSFT   # 中游：云（上游需求的总闸门之一）
  - META   # 中游：自用算力

benchmarks:
  SPY: 标普500
  QQQ: 纳斯达克100
  DIA: 道琼斯
  IWM: 罗素2000

sectors:
  XLK: 科技
  XLF: 金融
  XLE: 能源
  XLV: 医疗
  XLI: 工业
  XLY: 可选消费
  XLP: 必需消费
  XLU: 公用事业
  XLRE: 房地产
  XLB: 原材料
  XLC: 通信服务

macro:
  ^VIX: 恐慌指数 VIX
  ^TNX: 美债10年期收益率
  DX-Y.NYB: 美元指数 DXY
  GC=F: 黄金期货
  CL=F: 原油期货 WTI
  BTC-USD: 比特币
