# 调研状态机：把调研从"文档"变成"可检查的状态"
#
# 每个节点四件套：evidence（带时间戳的证据）、triggers（证伪触发器+状态）、
# open_questions（未决问题）、last_verified。
# `finloop loop-status` 据此自动判定：哪些过期、哪些待核、本轮是否可退出。
#
# trigger.status: ok（论点健康）| warning（黄色信号）| fired（已证伪，重审）
# question.status: open（阻塞退出）| deferred（显式搁置，不阻塞，需注明理由）

meta:
  cadence_days: 90 # 证据保鲜期 = 一个财报季
  rounds:
    - date: 2026-06-11
      scope: AI上游全链首轮（深度调研+估值验证）
      new_nodes: 13
      new_tickers: 102
      notes: 基线轮。发现 ZACROS/Arisawa/LandMark 等隐藏环节；估值侧验证完成。
    - date: 2026-06-12
      scope: Token→算力→数据中心需求传导链（单人轮）
      new_nodes: 1
      new_tickers: 0
      notes: 锚定节点建立。核心产出：需求vs效率赛跑框架 + 七信号面板 +
        三情景研判（报告 2026-06-12_token_to_datacenter.md）。
    - date: 2026-06-12
      scope: 第三、四轮——open 问题全清算（1组员轮 + 3组员轮）
      new_nodes: 0
      new_tickers: 0
      notes: 9 个 open 全闭环，状态机首次可退出。深挖名单换血（SUMCO 新晋，
        MU/LITE/TER 移除）。流程教训沉淀：一次性损益规则③、前提核验纪律。

global_triggers:
  - condition: 四大云厂 capex 指引环比走平或下修（总闸门）
    status: ok
    last_checked: 2026-06-11
    note: 2026 指引 $660-725B（+77%），仍在上修
  - condition: Token 量增速跌破效率增速（~3x/年）——悲观情景启动线
    status: ok
    last_checked: 2026-06-12
    note: Google 口径 7x YoY vs 效率 ~3x，缺口仍在扩大。年度刷新点 = Google I/O
  - condition: GPU 租金指数转跌（算力供需反转最快信号）
    status: ok
    last_checked: 2026-06-12
    note: B200 $4.08/hr，年内 +48%
  - condition: DRAM 合约价环比转负（挤出效应红利结束）
    status: ok
    last_checked: 2026-06-11
    note: 2026Q1 +90% vs Q4'25
  - condition: 终端 AI 收入对 capex 覆盖度持续恶化
    status: warning
    last_checked: 2026-06-11
    note: 缺口大，靠预期支撑——结构性黄灯，长期监控
  - condition: 周期面板 ≥3 信号同时转向（docs/chain/08）
    status: ok
    last_checked: 2026-06-12
    note: 当前 1 黄（SK砍单传闻）+ 1 结构黄（覆盖度）

