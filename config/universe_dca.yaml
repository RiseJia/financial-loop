# 定投（DCA）候选池——与 AI 主题池物理隔离
# 原则（2026-06 第五轮调研，详见 round5 报告 C 节）：
#   定投只适配"长期不死且向上"的资产；当前 CAPE 98 分位 → 十年回报预期 4-6%
#   核心-卫星结构；行业 ETF（SMH）≤10%；单股仅限通过五前提清单者
# 注意：这是被动纪律仓的候选池，不与 AI 研究池混仓

core:
  VOO: 标普500(0.03%费率/核心)
  VTI: 全市场(0.03%/核心替代)
  SCHD: 红利质量(0.06%/防御核心)
  VXUS: 国际分散(0.05%/估值折价)

satellite:
  QQQ: 纳指100(34.6x/进攻卫星)
  AVUV: 小盘价值(因子卫星/便宜)
  SMH: 半导体(极集中/卫星≤10%)

single_stock_qualified:
  BRK.B: 伯克希尔(1.6xP/B类指数/后巴菲特折价)
  MSFT: 微软(~21x回落合理/云+AI)

single_stock_watch:
  V: Visa(~25x低于十年均值/稳定币尾部风险)
  MA: 万事达(同V)
  COST: 好市多(47x好公司贵起点/等回调)
